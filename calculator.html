<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="calculator.css">
</head>
body>

  <div class="cont">        
  <button class="box"></button>
  <button class="ac" onclick="cr()">AC</button>
  <button class="br">(  )</button>
  <button class="mod" onclick="append('%')">%</button>
  <button class="di" onclick="append('/')">/</button>
  <button class="div7" onclick="append('7')">7</button>
  <button class="div8" onclick="append('8')">8</button>
  <button class="div9" onclick="append('9')">9</button>
  <button class="mul"onclick="append('*')"">x</button>
  <button class="div4" onclick="append('4')">4</button> 
  <button class="div5" onclick="append('5')">5</button>
  <button class="div6" onclick="append('6')">6</button>
  <button class="minus" onclick="append('-')">-</button>
  <button class="div1" onclick="append('1')">1</button>
  <button class="div2" onclick="append('2')">2</button>
  <button class="div3" onclick="append('3')">3</button>
  <button class="plus" onclick="append('+')">+</button>
  <button class="div0" onclick="append('0')">0</button>
  <button class="dot" onclick="append('.')">.</button>
  <button class="cancel" onclick="po()">X</button>
  <button class="equal" onclick="display()">=</button>
  </div>
<script src="calculator.js"></script>
</body>
</html>
